<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Forgot Password - Crypto Trading Platform</title>
    
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/font-awesome.min.css" rel="stylesheet">
    <link href="css/themify-icons.css" rel="stylesheet">
    <link href="css/animate.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    
    <style>
        .forgot-password-container {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 0;
        }
        
        .forgot-password-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }
        
        .forgot-password-card h2 {
            margin-bottom: 10px;
            color: #333;
            text-align: center;
            font-weight: bold;
        }
        
        .forgot-password-card .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group input.is-invalid {
            border-color: #dc3545;
        }
        
        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            color: #4CAF50;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
        
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .back-button {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 30px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .back-button:hover {
            text-decoration: underline;
        }
        
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }
        
        .alert.show {
            display: block;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #31708f;
        }
        
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-left: 5px;
        }
        
        .loading-spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 2px solid white;
            width: 12px;
            height: 12px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="forgot-password-container">
        <div class="forgot-password-card">
            <a href="login.html" class="back-button">← Back to Login</a>
            
            <h2>Reset Password</h2>
            <p class="subtitle">Enter your email address and we'll send you a link to reset your password</p>
            
            <div class="alert" id="alertBox"></div>
            
            <div class="info-box">
                <strong>💡 Tip:</strong> Check your spam folder if you don't receive the email within a few minutes.
            </div>
            
            <form id="forgotPasswordForm" method="POST" novalidate>
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
                    <div class="error-message"></div>
                </div>
                
                <button type="submit" class="btn-submit" id="submitBtn">
                    Send Reset Link
                    <span class="loading" style="display: none;">
                        <div class="loading-spinner"></div>
                    </span>
                </button>
            </form>
            
            <div class="back-link">
                Remember your password? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>
    
    <script src="js/jquery-3.2.1.min.js"></script>
    <script>
        $(document).ready(function() {
            const form = $('#forgotPasswordForm');
            const emailInput = $('#email');
            const submitBtn = $('#submitBtn');
            const alertBox = $('#alertBox');
            
            // Form submission
            form.on('submit', function(e) {
                e.preventDefault();
                
                // Clear previous alerts
                alertBox.removeClass('show alert-success alert-error');
                clearError();
                
                const email = emailInput.val().trim();
                
                // Validate email
                if (!email) {
                    showError(emailInput, 'Email is required');
                    return;
                }
                
                if (!isValidEmail(email)) {
                    showError(emailInput, 'Invalid email address');
                    return;
                }
                
                // Submit form
                submitBtn.disabled = true;
                submitBtn.find('.loading').show();
                
                $.ajax({
                    url: 'api/login.php',
                    method: 'POST',
                    dataType: 'json',
                    data: {
                        action: 'forgot_password',
                        email: email
                    },
                    success: function(response) {
                        if (response.success) {
                            alertBox.removeClass('alert-error').addClass('alert-success show');
                            alertBox.html('<strong>Success!</strong> ' + response.message);
                            
                            // Clear form
                            form[0].reset();
                            
                            // Disable form for 30 seconds
                            setTimeout(() => {
                                submitBtn.disabled = false;
                                submitBtn.find('.loading').hide();
                            }, 2000);
                        } else {
                            alertBox.removeClass('alert-success').addClass('alert-error show');
                            alertBox.html('<strong>Error!</strong> ' + response.message);
                            submitBtn.disabled = false;
                            submitBtn.find('.loading').hide();
                        }
                    },
                    error: function(xhr) {
                        const response = xhr.responseJSON || { message: 'An error occurred' };
                        alertBox.removeClass('alert-success').addClass('alert-error show');
                        alertBox.html('<strong>Error!</strong> ' + (response.message || 'Failed to send reset link'));
                        submitBtn.disabled = false;
                        submitBtn.find('.loading').hide();
                    }
                });
            });
            
            // Helper functions
            function showError(input, message) {
                input.addClass('is-invalid');
                input.closest('.form-group').find('.error-message').text(message).addClass('show');
            }
            
            function clearError() {
                emailInput.removeClass('is-invalid');
                emailInput.closest('.form-group').find('.error-message').removeClass('show');
            }
            
            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }
        });
    </script>
</body>

</html>

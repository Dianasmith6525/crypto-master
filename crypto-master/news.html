<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto News - Trading Platform</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .news-page {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 0;
        }
        .navbar-dashboard {
            background: rgba(255,255,255,0.1);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            margin-bottom: 30px;
        }
        .navbar-dashboard .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            transition: all 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            background: rgba(255,255,255,0.2);
        }
        .news-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .page-header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .page-header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: white;
        }
        .page-header p {
            font-size: 18px;
            opacity: 0.9;
        }
        
        /* Filters */
        .filters-card {
            background: white;
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-label {
            font-size: 14px;
            font-weight: 600;
            color: #666;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            color: #666;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .filter-btn:hover {
            border-color: #4e63d7;
        }
        .filter-btn.active {
            background: #4e63d7;
            color: white;
            border-color: #4e63d7;
        }
        .crypto-filter {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        /* News Grid */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .news-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            position: relative;
        }
        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 12px;
            color: #999;
        }
        .news-source {
            font-weight: 600;
            color: #4e63d7;
        }
        .news-time {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .news-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .news-currencies {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .currency-tag {
            background: #f0f0f0;
            color: #666;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .currency-tag.btc {
            background: #f7931a20;
            color: #f7931a;
        }
        .currency-tag.eth {
            background: #627eea20;
            color: #627eea;
        }
        .news-votes {
            display: flex;
            gap: 15px;
            padding-top: 12px;
            border-top: 1px solid #f0f0f0;
        }
        .vote-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #666;
        }
        .vote-item i {
            font-size: 14px;
        }
        .vote-positive {
            color: #4caf50;
        }
        .vote-negative {
            color: #f44336;
        }
        .vote-important {
            color: #ff9800;
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }
        .loading i {
            font-size: 48px;
            margin-bottom: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 100px 20px;
            background: white;
            border-radius: 12px;
        }
        .empty-state i {
            font-size: 64px;
            color: #ccc;
            margin-bottom: 20px;
        }
        
        /* Load More */
        .load-more {
            text-align: center;
            margin: 30px 0;
        }
        .load-more-btn {
            padding: 12px 30px;
            background: white;
            color: #4e63d7;
            border: 2px solid white;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .load-more-btn:hover {
            background: #4e63d7;
            color: white;
        }
        
        @media (max-width: 768px) {
            .news-grid {
                grid-template-columns: 1fr;
            }
            .filters-card {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="news-page">
        <!-- Navigation -->
        <nav class="navbar-dashboard">
            <div class="container">
                <div class="logo">CryptoTrade</div>
                <div class="nav-links">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="watchlist.html">Watchlist</a>
                    <a href="alerts.html">Alerts</a>
                    <a href="trade-history.html">Trade History</a>
                    <a href="charts.html">Charts</a>
                    <a href="analytics.html">Analytics</a>
                    <a href="news.html" class="active">News</a>
                    <a href="#" onclick="logout()">Logout</a>
                </div>
            </div>
        </nav>

        <div class="news-container">
            <!-- Page Header -->
            <div class="page-header">
                <h1><i class="fa fa-newspaper-o"></i> Crypto News</h1>
                <p>Stay updated with the latest cryptocurrency news and market insights</p>
            </div>

            <!-- Filters -->
            <div class="filters-card">
                <span class="filter-label">Filter:</span>
                <button class="filter-btn active" data-filter="rising" onclick="changeFilter('rising')">
                    <i class="fa fa-fire"></i> Rising
                </button>
                <button class="filter-btn" data-filter="hot" onclick="changeFilter('hot')">
                    <i class="fa fa-bolt"></i> Hot
                </button>
                <button class="filter-btn" data-filter="latest" onclick="changeFilter('latest')">
                    <i class="fa fa-clock-o"></i> Latest
                </button>
                <button class="filter-btn" data-filter="important" onclick="changeFilter('important')">
                    <i class="fa fa-star"></i> Important
                </button>
                
                <span class="filter-label">|</span>
                <span class="filter-label">Crypto:</span>
                <div class="crypto-filter">
                    <button class="filter-btn active" data-crypto="" onclick="filterByCrypto('')">All</button>
                    <button class="filter-btn" data-crypto="BTC" onclick="filterByCrypto('BTC')">BTC</button>
                    <button class="filter-btn" data-crypto="ETH" onclick="filterByCrypto('ETH')">ETH</button>
                    <button class="filter-btn" data-crypto="SOL" onclick="filterByCrypto('SOL')">SOL</button>
                    <button class="filter-btn" data-crypto="ADA" onclick="filterByCrypto('ADA')">ADA</button>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="loading">
                <i class="fa fa-spinner"></i>
                <p>Loading news...</p>
            </div>

            <!-- News Grid -->
            <div id="newsGrid" class="news-grid" style="display: none;">
                <!-- Populated by JavaScript -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fa fa-newspaper-o"></i>
                <h3>No News Found</h3>
                <p>Try changing your filters to see more articles.</p>
            </div>

            <!-- Load More -->
            <div id="loadMoreSection" class="load-more" style="display: none;">
                <button class="load-more-btn" onclick="loadMore()">
                    <i class="fa fa-refresh"></i> Load More News
                </button>
            </div>
        </div>
    </div>

    <script src="js/jquery-3.2.1.min.js"></script>
    <script>
        let currentFilter = 'rising';
        let currentCrypto = '';
        let currentPage = 1;
        let allNews = [];

        $(document).ready(function() {
            loadNews();
        });

        function loadNews() {
            $('#loadingState').show();
            $('#newsGrid').hide();
            $('#emptyState').hide();
            
            let url = `api/crypto-news.php?filter=${currentFilter}&page=${currentPage}`;
            if (currentCrypto) {
                url += `&currencies=${currentCrypto}`;
            }
            
            $.ajax({
                url: url,
                method: 'GET',
                dataType: 'json',
                success: function(response) {
                    if (response.success && response.news.length > 0) {
                        if (currentPage === 1) {
                            allNews = response.news;
                        } else {
                            allNews = allNews.concat(response.news);
                        }
                        displayNews(allNews);
                        
                        if (response.next_page) {
                            $('#loadMoreSection').show();
                        } else {
                            $('#loadMoreSection').hide();
                        }
                    } else {
                        $('#emptyState').show();
                    }
                    $('#loadingState').hide();
                },
                error: function() {
                    $('#loadingState').hide();
                    $('#emptyState').show();
                }
            });
        }

        function displayNews(news) {
            let html = '';
            
            news.forEach(article => {
                const timeAgo = getTimeAgo(article.published_at);
                const currencies = article.currencies.slice(0, 3);
                
                let currencyTags = '';
                currencies.forEach(curr => {
                    const tagClass = curr.toLowerCase();
                    currencyTags += `<span class="currency-tag ${tagClass}">${curr}</span>`;
                });
                
                html += `
                    <div class="news-card" onclick="openArticle('${article.url}')">
                        <div class="news-meta">
                            <span class="news-source">${article.source}</span>
                            <span class="news-time">
                                <i class="fa fa-clock-o"></i>
                                ${timeAgo}
                            </span>
                        </div>
                        <h3 class="news-title">${article.title}</h3>
                        <div class="news-currencies">
                            ${currencyTags}
                        </div>
                        <div class="news-votes">
                            <div class="vote-item vote-positive">
                                <i class="fa fa-thumbs-up"></i>
                                ${article.votes.positive}
                            </div>
                            <div class="vote-item vote-negative">
                                <i class="fa fa-thumbs-down"></i>
                                ${article.votes.negative}
                            </div>
                            <div class="vote-item vote-important">
                                <i class="fa fa-star"></i>
                                ${article.votes.important}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            $('#newsGrid').html(html).show();
        }

        function changeFilter(filter) {
            currentFilter = filter;
            currentPage = 1;
            
            $('.filter-btn[data-filter]').removeClass('active');
            $(`.filter-btn[data-filter="${filter}"]`).addClass('active');
            
            loadNews();
        }

        function filterByCrypto(crypto) {
            currentCrypto = crypto;
            currentPage = 1;
            
            $('.filter-btn[data-crypto]').removeClass('active');
            $(`.filter-btn[data-crypto="${crypto}"]`).addClass('active');
            
            loadNews();
        }

        function loadMore() {
            currentPage++;
            loadNews();
        }

        function openArticle(url) {
            if (url && url !== '#') {
                window.open(url, '_blank');
            }
        }

        function getTimeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
            if (seconds < 604800) return Math.floor(seconds / 86400) + 'd ago';
            
            return date.toLocaleDateString();
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.clear();
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral Program - CryptoTrade Pro</title>

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow-x: hidden;
        }

        body.light-mode {
            --bg-dark: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
        }

        /* Top Navigation */
        .top-nav {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .theme-toggle, .notifications-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-toggle:hover, .notifications-btn:hover {
            background: var(--primary-gradient);
            color: white;
        }

        /* Main Content */
        .main-content {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .stat-icon.users { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .stat-icon.earnings { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .stat-icon.clicks { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .stat-icon.conversion { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Content Sections */
        .content-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Referral Link Section */
        .referral-link-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 2rem;
            color: white;
            margin-bottom: 2rem;
        }

        .referral-code {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            word-break: break-all;
        }

        .referral-link {
            background: rgba(255,255,255,0.2);
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            word-break: break-all;
            margin-bottom: 1rem;
        }

        .share-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .share-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .share-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-1px);
        }

        /* Tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table th {
            background: var(--bg-dark);
            font-weight: 600;
            color: var(--text-primary);
        }

        .data-table tr:hover {
            background: rgba(255,255,255,0.02);
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-credited { background: #10b981; color: white; }
        .status-pending { background: #f59e0b; color: white; }
        .status-cancelled { background: #ef4444; color: white; }

        /* Loading and Error States */
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                padding: 1rem;
            }

            .page-title {
                font-size: 2rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .share-buttons {
                flex-direction: column;
            }

            .data-table {
                font-size: 0.9rem;
            }

            .data-table th,
            .data-table td {
                padding: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="logo">CryptoTrade Pro</div>
        <div class="nav-actions">
            <button class="theme-toggle" onclick="toggleTheme()">
                <i class="fa fa-moon-o"></i>
            </button>
            <button class="notifications-btn">
                <i class="fa fa-bell"></i>
            </button>
            <a href="dashboard-pro.html" class="btn btn-outline-primary">Dashboard</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title">Referral Program</h1>
            <p class="page-subtitle">Earn rewards by inviting friends to join CryptoTrade Pro</p>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-icon users">
                    <i class="fa fa-users"></i>
                </div>
                <div class="stat-value" id="totalReferrals">0</div>
                <div class="stat-label">Total Referrals</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon earnings">
                    <i class="fa fa-dollar"></i>
                </div>
                <div class="stat-value" id="totalEarnings">$0.00</div>
                <div class="stat-label">Total Earnings</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon clicks">
                    <i class="fa fa-mouse-pointer"></i>
                </div>
                <div class="stat-value" id="totalClicks">0</div>
                <div class="stat-label">Link Clicks</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon conversion">
                    <i class="fa fa-chart-line"></i>
                </div>
                <div class="stat-value" id="conversionRate">0%</div>
                <div class="stat-label">Conversion Rate</div>
            </div>
        </div>

        <!-- Referral Link Section -->
        <div class="referral-link-container" id="referralLinkSection">
            <h3 style="margin-bottom: 1rem;">Your Referral Link</h3>
            <div class="referral-code" id="referralCode">Loading...</div>
            <div class="referral-link" id="referralLink">Loading...</div>
            <div class="share-buttons">
                <button class="share-btn" onclick="shareLink('direct')">
                    <i class="fa fa-link"></i> Copy Link
                </button>
                <button class="share-btn" onclick="shareLink('facebook')">
                    <i class="fa fa-facebook"></i> Facebook
                </button>
                <button class="share-btn" onclick="shareLink('twitter')">
                    <i class="fa fa-twitter"></i> Twitter
                </button>
                <button class="share-btn" onclick="shareLink('whatsapp')">
                    <i class="fa fa-whatsapp"></i> WhatsApp
                </button>
                <button class="share-btn" onclick="shareLink('linkedin')">
                    <i class="fa fa-linkedin"></i> LinkedIn
                </button>
            </div>
        </div>

        <!-- Referrals List -->
        <div class="content-section">
            <h2 class="section-title">
                <i class="fa fa-users"></i> Your Referrals
            </h2>
            <div id="referralsTable">
                <div class="loading">Loading referrals...</div>
            </div>
        </div>

        <!-- Earnings History -->
        <div class="content-section">
            <h2 class="section-title">
                <i class="fa fa-history"></i> Earnings History
            </h2>
            <div id="earningsTable">
                <div class="loading">Loading earnings...</div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let currentTheme = localStorage.getItem('theme') || 'dark';
        let referralData = {};

        // Initialize page
        $(document).ready(function() {
            applyTheme();
            loadReferralStats();
            loadReferralLink();
            loadReferrals();
            loadEarnings();
        });

        // Theme toggle
        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', currentTheme);
            applyTheme();
        }

        function applyTheme() {
            if (currentTheme === 'light') {
                document.body.classList.add('light-mode');
                $('.theme-toggle i').removeClass('fa-moon-o').addClass('fa-sun-o');
            } else {
                document.body.classList.remove('light-mode');
                $('.theme-toggle i').removeClass('fa-sun-o').addClass('fa-moon-o');
            }
        }

        // Load referral statistics
        function loadReferralStats() {
            $.get('api/referrals.php?action=stats', function(response) {
                if (response.success) {
                    $('#totalReferrals').text(response.stats.total_referrals);
                    $('#totalEarnings').text('$' + response.stats.total_earnings.toFixed(2));
                    $('#totalClicks').text(response.stats.total_clicks);
                    $('#conversionRate').text(response.stats.conversion_rate + '%');
                } else {
                    showError('Failed to load referral statistics');
                }
            }).fail(function() {
                showError('Failed to load referral statistics');
            });
        }

        // Load referral link
        function loadReferralLink() {
            $.get('api/referrals.php?action=link', function(response) {
                if (response.success) {
                    $('#referralCode').text(response.referral_code);
                    $('#referralLink').text(response.referral_link);
                    referralData = response;
                } else {
                    $('#referralLinkSection').html('<div class="error">Failed to load referral link</div>');
                }
            }).fail(function() {
                $('#referralLinkSection').html('<div class="error">Failed to load referral link</div>');
            });
        }

        // Load referrals list
        function loadReferrals() {
            $.get('api/referrals.php?action=referrals', function(response) {
                if (response.success) {
                    displayReferrals(response.referrals);
                } else {
                    $('#referralsTable').html('<div class="error">Failed to load referrals</div>');
                }
            }).fail(function() {
                $('#referralsTable').html('<div class="error">Failed to load referrals</div>');
            });
        }

        // Load earnings history
        function loadEarnings() {
            $.get('api/referrals.php?action=earnings', function(response) {
                if (response.success) {
                    displayEarnings(response.earnings);
                } else {
                    $('#earningsTable').html('<div class="error">Failed to load earnings</div>');
                }
            }).fail(function() {
                $('#earningsTable').html('<div class="error">Failed to load earnings</div>');
            });
        }

        // Display referrals table
        function displayReferrals(referrals) {
            if (referrals.length === 0) {
                $('#referralsTable').html('<p style="text-align: center; color: var(--text-secondary); padding: 2rem;">No referrals yet. Share your referral link to get started!</p>');
                return;
            }

            let html = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Join Date</th>
                            <th>Total Trades</th>
                            <th>Trading Volume</th>
                            <th>Your Earnings</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            referrals.forEach(referral => {
                html += `
                    <tr>
                        <td>${referral.name}</td>
                        <td>${referral.email}</td>
                        <td>${new Date(referral.join_date).toLocaleDateString()}</td>
                        <td>${referral.total_trades}</td>
                        <td>$${referral.total_volume.toFixed(2)}</td>
                        <td>$${referral.total_earnings.toFixed(2)}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            $('#referralsTable').html(html);
        }

        // Display earnings table
        function displayEarnings(earnings) {
            if (earnings.length === 0) {
                $('#earningsTable').html('<p style="text-align: center; color: var(--text-secondary); padding: 2rem;">No earnings yet. Earnings will appear here when your referrals start trading!</p>');
                return;
            }

            let html = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Referral</th>
                            <th>Bonus Type</th>
                            <th>Amount</th>
                            <th>Trade Volume</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            earnings.forEach(earning => {
                const statusClass = earning.status === 'credited' ? 'status-credited' :
                                  earning.status === 'pending' ? 'status-pending' : 'status-cancelled';

                html += `
                    <tr>
                        <td>${earning.referee_name}</td>
                        <td>${earning.bonus_type.replace('_', ' ').toUpperCase()}</td>
                        <td>$${earning.bonus_amount.toFixed(2)}</td>
                        <td>$${earning.trade_volume.toFixed(2)}</td>
                        <td><span class="status-badge ${statusClass}">${earning.status}</span></td>
                        <td>${new Date(earning.created_at).toLocaleDateString()}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            $('#earningsTable').html(html);
        }

        // Share referral link
        function shareLink(platform) {
            if (!referralData.referral_link) {
                alert('Referral link not loaded yet. Please try again.');
                return;
            }

            const link = referralData.referral_link;

            if (platform === 'direct') {
                navigator.clipboard.writeText(link).then(function() {
                    alert('Referral link copied to clipboard!');
                }).catch(function() {
                    // Fallback for older browsers
                    const textArea = document.createElement('textarea');
                    textArea.value = link;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    alert('Referral link copied to clipboard!');
                });
            } else {
                // Generate platform-specific sharing
                $.post('api/referrals.php', {
                    action: 'generate_link',
                    platform: platform
                }, function(response) {
                    if (response.success) {
                        window.open(response.selected_link, '_blank');
                    } else {
                        alert('Failed to generate sharing link');
                    }
                });
            }
        }

        // Show error message
        function showError(message) {
            const errorDiv = $('<div class="error"></div>').text(message);
            $('.main-content').prepend(errorDiv);
            setTimeout(() => errorDiv.fadeOut(), 5000);
        }

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
